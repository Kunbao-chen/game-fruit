<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>水果大合併 - 超順暢版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #0c0a09;
      color: #f8fafc;
      font-family: 'Press Start 2P', cursive, monospace;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }

    .neon-border {
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.4), inset 0 0 10px rgba(245, 158, 11, 0.15);
    }

    .btn-act:active {
      transform: scale(0.92);
      filter: brightness(1.3);
    }
  </style>
</head>
<body class="flex flex-col justify-between items-center w-full h-full p-1">

  <!-- 1. 頂部狀態列 -->
  <header class="w-full bg-stone-900/90 rounded-lg p-1.5 border border-stone-800 flex items-center justify-between text-[10px] shrink-0 z-10">
    <div class="flex items-center gap-1.5">
      <span class="text-[8px] text-stone-400">NEXT:</span>
      <span id="nextFruitEmoji" class="text-lg">🍒</span>
    </div>

    <div class="flex items-center gap-4">
      <div class="flex flex-col items-center">
        <div class="text-[7px] text-stone-400">SCORE</div>
        <div id="score" class="text-xs text-amber-400 font-bold">0</div>
      </div>
      <div class="flex flex-col items-center">
        <div class="text-[7px] text-red-400">BOMB</div>
        <div id="bombCountHUD" class="text-xs text-red-500 font-bold">1</div>
      </div>
    </div>

    <div class="text-[8px] text-amber-500 font-sans font-bold">
      🍉 合成大西瓜
    </div>
  </header>

  <!-- 2. 中間草圖配置：左（↓/←）| 中央水果容器 | 右（投擲/→） -->
  <main id="mainContainer" class="flex-1 w-full flex items-stretch gap-1 my-1 relative min-h-0 overflow-hidden">
    
    <!-- 左側按鈕區 -->
    <div class="w-16 sm:w-20 flex flex-col gap-1 shrink-0 z-10">
      <button id="btnDown" class="flex-1 bg-stone-800 border-2 border-stone-600 rounded-xl text-2xl font-bold flex flex-col items-center justify-center btn-act">
        <span>↓</span>
        <span class="text-[8px] font-sans text-amber-400 mt-1">投擲</span>
      </button>
      <button id="btnLeft" class="flex-1 bg-stone-800 border-2 border-stone-600 rounded-xl text-2xl font-bold flex flex-col items-center justify-center btn-act">
        <span>←</span>
        <span class="text-[8px] font-sans text-stone-400 mt-1">靠左</span>
      </button>
    </div>

    <!-- 中央水果放置畫布 -->
    <div id="canvasContainer" class="flex-1 relative bg-stone-950 rounded-xl border-2 border-amber-500/60 neon-border flex items-center justify-center overflow-hidden">
      <canvas id="fruitCanvas" class="bg-stone-950 rounded-lg block"></canvas>
      
      <!-- 蓋版選單 -->
      <div id="overlay" class="absolute inset-0 bg-stone-950/95 rounded-xl flex flex-col items-center justify-center p-4 gap-4 z-50">
        <h2 id="overlayTitle" class="text-xl text-amber-400 font-bold text-center">水果大合併</h2>
        <p id="finalScore" class="text-xs text-stone-300 font-sans hidden">最終得分: 0</p>
        <button id="startBtn" class="px-8 py-4 bg-amber-500 hover:bg-amber-400 active:scale-95 text-stone-950 text-sm font-bold rounded-xl font-sans shadow-lg cursor-pointer">
          開始遊戲
        </button>
      </div>
    </div>

    <!-- 右側按鈕區 -->
    <div class="w-16 sm:w-20 flex flex-col gap-1 shrink-0 z-10">
      <button id="btnDropRight" class="flex-1 bg-amber-700 border-2 border-amber-500 rounded-xl text-2xl font-bold text-amber-100 flex flex-col items-center justify-center btn-act shadow-md">
        <span>🎯</span>
        <span class="text-[8px] font-sans text-amber-200 mt-1">發射</span>
      </button>
      <button id="btnRight" class="flex-1 bg-stone-800 border-2 border-stone-600 rounded-xl text-2xl font-bold flex flex-col items-center justify-center btn-act">
        <span>→</span>
        <span class="text-[8px] font-sans text-stone-400 mt-1">靠右</span>
      </button>
    </div>

  </main>

  <!-- 3. 底部功能鍵 -->
  <footer class="w-full grid grid-cols-3 gap-1.5 items-stretch shrink-0 pb-1 h-[14vh] max-h-[110px] min-h-[75px] z-10">
    <button id="btnPause" class="bg-stone-800 border-2 border-stone-600 rounded-xl text-xl font-bold flex flex-col items-center justify-center btn-act text-stone-200">
      <span>⏸️</span>
      <span class="text-[8px] font-sans text-stone-400 mt-0.5">Pause</span>
    </button>

    <button id="btnRestart" class="bg-stone-800 border-2 border-stone-600 rounded-xl text-sm font-bold flex flex-col items-center justify-center btn-act text-amber-300">
      <span class="text-lg">🔄</span>
      <span class="text-[9px] font-sans mt-0.5">Restart</span>
    </button>

    <button id="btnBomb" class="bg-red-900/80 border-2 border-red-500 rounded-xl text-white font-bold flex flex-col items-center justify-center btn-act relative">
      <span class="text-xl">💣</span>
      <span id="btnBombText" class="text-[9px] font-sans text-red-300 mt-0.5">炸彈 (1)</span>
    </button>
  </footer>

  <script>
    var canvas = document.getElementById('fruitCanvas');
    var ctx = canvas.getContext('2d');

    var scoreEl = document.getElementById('score');
    var bombCountHUD = document.getElementById('bombCountHUD');
    var btnBombText = document.getElementById('btnBombText');
    var nextFruitEmoji = document.getElementById('nextFruitEmoji');

    var overlay = document.getElementById('overlay');
    var overlayTitle = document.getElementById('overlayTitle');
    var finalScore = document.getElementById('finalScore');
    var startBtn = document.getElementById('startBtn');

    // 7種水果定義 (輕量化半徑)
    var FRUITS = [
      { level: 0, emoji: '🍒', radius: 18, score: 2 },
      { level: 1, emoji: '🍓', radius: 25, score: 6 },
      { level: 2, emoji: '🍇', radius: 32, score: 14 },
      { level: 3, emoji: '🍊', radius: 42, score: 30 },
      { level: 4, emoji: '🍎', radius: 52, score: 62 },
      { level: 5, emoji: '🍑', radius: 64, score: 126 },
      { level: 6, emoji: '🍉', radius: 78, score: 254 }
    ];

    var fruitsOnBoard = [];
    var score = 0;
    var bombInventory = 1;
    var gameOver = false, isPaused = false, gameStarted = false;

    var currentFruitX = 0;
    var currentFruitType = 0;
    var nextFruitType = 0;
    var canDrop = true;

    function resizeCanvas() {
      var container = document.getElementById('canvasContainer');
      if (!container) return;
      canvas.width = container.clientWidth - 8;
      canvas.height = container.clientHeight - 8;
      if (currentFruitX === 0) currentFruitX = canvas.width / 2;
    }
    window.addEventListener('resize', resizeCanvas);

    var audioCtx = null;
    function initAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}
    }

    function playPopSound(pitch) {
      if (!audioCtx) return;
      try {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(250 + pitch * 80, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch(e){}
    }

    function FruitItem(x, y, level) {
      this.x = x;
      this.y = y;
      this.vy = 0;
      this.level = level;
      this.radius = FRUITS[level].radius;
      this.emoji = FRUITS[level].emoji;
      this.isDropping = true;
      this.isMerged = false;
    }

    function spawnNextFruit() {
      currentFruitType = nextFruitType;
      nextFruitType = Math.floor(Math.random() * 3);
      nextFruitEmoji.innerText = FRUITS[nextFruitType].emoji;
      canDrop = true;
    }

    function moveCurrentFruit(dir) {
      if (!gameStarted || isPaused || gameOver || !canDrop) return;
      var step = 15;
      var r = FRUITS[currentFruitType].radius;
      currentFruitX += dir * step;
      if (currentFruitX < r) currentFruitX = r;
      if (currentFruitX > canvas.width - r) currentFruitX = canvas.width - r;
    }

    function dropFruit() {
      if (!gameStarted || isPaused || gameOver || !canDrop) return;
      canDrop = false;
      var newFruit = new FruitItem(currentFruitX, 50, currentFruitType);
      fruitsOnBoard.push(newFruit);
      playPopSound(1);

      setTimeout(function() {
        if (!gameOver) spawnNextFruit();
      }, 350);
    }

    function activateBomb() {
      if (bombInventory <= 0 || !gameStarted || isPaused || gameOver) return;
      bombInventory--;
      playPopSound(8);

      // 清除底部 3 個水果
      fruitsOnBoard.sort(function(a, b){ return b.y - a.y; });
      fruitsOnBoard.splice(0, Math.min(3, fruitsOnBoard.length));

      updateUI();
    }

    // 超穩定輕量化物理更新
    function updatePhysics() {
      var gravity = 0.6;

      for (var i = 0; i < fruitsOnBoard.length; i++) {
        var f = fruitsOnBoard[i];
        
        if (f.isDropping) {
          f.vy += gravity;
          f.y += f.vy;

          // 觸底停止
          if (f.y + f.radius >= canvas.height) {
            f.y = canvas.height - f.radius;
            f.isDropping = false;
            f.vy = 0;
          }

          // 撞擊下方水果停止
          for (var j = 0; j < fruitsOnBoard.length; j++) {
            if (i === j) continue;
            var other = fruitsOnBoard[j];
            var dx = f.x - other.x;
            var dy = f.y - other.y;
            var dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < f.radius + other.radius && f.y < other.y) {
              f.y = other.y - (f.radius + other.radius);
              f.isDropping = false;
              f.vy = 0;
              break;
            }
          }
        }
      }

      // 檢查水果碰撞合併
      for (var i = 0; i < fruitsOnBoard.length; i++) {
        for (var j = i + 1; j < fruitsOnBoard.length; j++) {
          var f1 = fruitsOnBoard[i];
          var f2 = fruitsOnBoard[j];

          if (f1.isMerged || f2.isMerged) continue;

          var dx = f2.x - f1.x;
          var dy = f2.y - f1.y;
          var dist = Math.sqrt(dx * dx + dy * dy);

          // 相同水果重疊 ➔ 觸發升級！
          if (dist < f1.radius + f2.radius + 2 && f1.level === f2.level && f1.level < FRUITS.length - 1) {
            f1.isMerged = true;
            f2.isMerged = true;

            var newLevel = f1.level + 1;
            var newX = (f1.x + f2.x) / 2;
            var newY = (f1.y + f2.y) / 2;

            score += FRUITS[newLevel].score;
            playPopSound(newLevel);

            if (newLevel >= 4) bombInventory++; // 獎勵炸彈

            (function(nx, ny, nl) {
              setTimeout(function() {
                fruitsOnBoard = fruitsOnBoard.filter(function(item){ return !item.isMerged; });
                var nf = new FruitItem(nx, ny, nl);
                nf.isDropping = false;
                fruitsOnBoard.push(nf);
                updateUI();
              }, 30);
            })(newX, newY, newLevel);
          }
        }
      }

      // 溢出判定
      for (var k = 0; k < fruitsOnBoard.length; k++) {
        if (!fruitsOnBoard[k].isDropping && fruitsOnBoard[k].y - fruitsOnBoard[k].radius < 65) {
          gameOver = true;
          showOverlay('遊戲結束');
          break;
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(245, 158, 11, 0.3)';
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(0, 65);
      ctx.lineTo(canvas.width, 65);
      ctx.stroke();
      ctx.setLineDash([]);

      if (canDrop && gameStarted && !isPaused && !gameOver) {
        var currentRadius = FRUITS[currentFruitType].radius;
        ctx.font = (currentRadius * 1.4) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(FRUITS[currentFruitType].emoji, currentFruitX, 35);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.beginPath();
        ctx.moveTo(currentFruitX, 35);
        ctx.lineTo(currentFruitX, canvas.height);
        ctx.stroke();
      }

      for (var i = 0; i < fruitsOnBoard.length; i++) {
        var f = fruitsOnBoard[i];
        ctx.font = (f.radius * 1.3) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(f.emoji, f.x, f.y);
      }
    }

    function updateUI() {
      scoreEl.innerText = score;
      bombCountHUD.innerText = bombInventory;
      btnBombText.innerText = '炸彈 (' + bombInventory + ')';
    }

    function gameLoop() {
      if (gameStarted && !isPaused && !gameOver) {
        updatePhysics();
        draw();
      }
      requestAnimationFrame(gameLoop);
    }

    function handleStartGame() {
      initAudio();
      fruitsOnBoard = [];
      score = 0;
      bombInventory = 1;
      gameOver = false;
      isPaused = false;
      gameStarted = true;
      overlay.classList.add('hidden');
      resizeCanvas();
      nextFruitType = Math.floor(Math.random() * 3);
      spawnNextFruit();
      updateUI();
    }

    function togglePause() {
      if (!gameStarted || gameOver) return;
      isPaused = !isPaused;
      if (isPaused) {
        showOverlay('遊戲暫停');
      } else {
        overlay.classList.add('hidden');
      }
    }

    function showOverlay(title) {
      overlayTitle.innerText = title;
      finalScore.innerText = '最終得分: ' + score;
      if (title !== '水果大合併') finalScore.classList.remove('hidden');
      startBtn.innerText = title === '遊戲暫停' ? '繼續遊戲' : '開始遊戲';
      overlay.classList.remove('hidden');
    }

    function bindButton(elementId, onClickAction, isContinuous) {
      var btn = document.getElementById(elementId);
      if (!btn) return;
      var timer = null;
      var repeatTimer = null;

      function start(e) {
        if (e && e.cancelable) e.preventDefault();
        initAudio();
        btn.classList.add('active');
        onClickAction();

        if (isContinuous) {
          timer = setTimeout(function() {
            repeatTimer = setInterval(onClickAction, 60);
          }, 160);
        }
      }

      function end(e) {
        if (e && e.cancelable) e.preventDefault();
        btn.classList.remove('active');
        clearTimeout(timer);
        clearInterval(repeatTimer);
      }

      btn.addEventListener('touchstart', start, { passive: false });
      btn.addEventListener('touchend', end);
      btn.addEventListener('touchcancel', end);

      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
      btn.addEventListener('mouseleave', end);
    }

    bindButton('btnLeft', function(){ moveCurrentFruit(-1); }, true);
    bindButton('btnRight', function(){ moveCurrentFruit(1); }, true);
    bindButton('btnDown', function(){ dropFruit(); }, false);
    bindButton('btnDropRight', function(){ dropFruit(); }, false);

    bindButton('btnPause', function(){ togglePause(); }, false);
    bindButton('btnRestart', function(){ handleStartGame(); }, false);
    bindButton('btnBomb', function(){ activateBomb(); }, false);

    startBtn.addEventListener('click', function(e) {
      e.preventDefault();
      if (isPaused) togglePause();
      else handleStartGame();
    });
    startBtn.addEventListener('touchend', function(e) {
      e.preventDefault();
      if (isPaused) togglePause();
      else handleStartGame();
    });

    resizeCanvas();
    showOverlay('水果大合併');
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
