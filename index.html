<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>水果大合併 - 原生物理完美版</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #0c0a09;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 4px;
    }

    /* 頂部 HUD */
    header {
      width: 100%;
      background-color: rgba(28, 25, 23, 0.95);
      border-radius: 8px;
      padding: 6px 12px;
      border: 1px solid #292524;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      flex-shrink: 0;
      z-index: 10;
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .hud-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hud-label {
      font-size: 9px;
      color: #a8a29e;
    }
    .hud-value {
      font-size: 13px;
      font-weight: bold;
      color: #fbbf24;
    }

    /* 主遊戲區域 */
    main {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: stretch;
      gap: 4px;
      margin: 4px 0;
      position: relative;
      min-height: 0;
      overflow: hidden;
    }

    .side-panel {
      width: 64px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
      z-index: 10;
    }

    .canvas-box {
      flex: 1;
      position: relative;
      background-color: #0c0a09;
      border-radius: 12px;
      border: 2px solid rgba(245, 158, 11, 0.6);
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    canvas {
      display: block;
      background-color: #0c0a09;
      border-radius: 8px;
    }

    /* 按鈕樣式與點擊回饋 */
    .btn-ctrl {
      background-color: #292524;
      border: 2px solid #57534e;
      border-radius: 12px;
      color: #f5f5f4;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex: 1;
      transition: transform 0.05s ease, background-color 0.05s ease;
    }
    .btn-ctrl:active, .btn-ctrl.active {
      transform: scale(0.92);
      filter: brightness(1.3);
    }
    .btn-ctrl-primary {
      background-color: #b45309;
      border-color: #f59e0b;
      color: #fff;
    }
    .btn-ctrl-bomb {
      background-color: #7f1d1d;
      border-color: #ef4444;
      color: #fff;
    }

    .btn-subtext {
      font-size: 10px;
      margin-top: 2px;
    }

    /* 底部選單按鈕區 */
    footer {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      height: 14vh;
      max-height: 100px;
      min-height: 70px;
      flex-shrink: 0;
      z-index: 10;
    }

    /* 蓋版選單 */
    #overlay {
      position: absolute;
      inset: 0;
      background-color: rgba(12, 10, 9, 0.95);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 50;
    }

    .overlay-title {
      font-size: 22px;
      font-weight: bold;
      color: #f59e0b;
    }
    .overlay-score {
      font-size: 13px;
      color: #d6d3d1;
    }
    .btn-start {
      padding: 12px 32px;
      background-color: #f59e0b;
      color: #0c0a09;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
      cursor: pointer;
    }
    .btn-start:active {
      transform: scale(0.94);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- 1. 頂部 HUD -->
  <header>
    <div style="display: flex; align-items: center; gap: 6px;">
      <span style="color: #a8a29e; font-size: 10px;">NEXT:</span>
      <span id="nextFruitEmoji" style="font-size: 18px;">🍒</span>
    </div>

    <div class="hud-group">
      <div class="hud-item">
        <span class="hud-label">SCORE</span>
        <span id="score" class="hud-value">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label" style="color:#ef4444;">BOMB</span>
        <span id="bombCountHUD" class="hud-value" style="color:#ef4444;">1</span>
      </div>
    </div>

    <div style="color: #f59e0b; font-weight: bold; font-size: 11px;">
      🍉 合成大西瓜
    </div>
  </header>

  <!-- 2. 中間草圖配置：左（↓/←）| 中央遊戲區 | 右（🎯/→）[cite: 4, 5] -->
  <main id="mainContainer">
    
    <!-- 左側按鈕[cite: 4, 5] -->
    <div class="side-panel">
      <button id="btnDown" class="btn-ctrl">
        <span style="font-size: 22px;">↓</span>
        <span class="btn-subtext" style="color: #fbbf24;">投擲</span>
      </button>
      <button id="btnLeft" class="btn-ctrl">
        <span style="font-size: 22px;">←</span>
        <span class="btn-subtext" style="color: #a8a29e;">靠左</span>
      </button>
    </div>

    <!-- 中央物理畫布[cite: 4, 5] -->
    <div id="canvasContainer" class="canvas-box">
      <canvas id="fruitCanvas"></canvas>
      
      <!-- 蓋版選單[cite: 5] -->
      <div id="overlay">
        <div id="overlayTitle" class="overlay-title">水果大合併</div>
        <div id="finalScore" class="overlay-score hidden">最終得分: 0</div>
        <button id="startBtn" class="btn-start">開始遊戲</button>
      </div>
    </div>

    <!-- 右側按鈕[cite: 4, 5] -->
    <div class="side-panel">
      <button id="btnDropRight" class="btn-ctrl btn-ctrl-primary">
        <span style="font-size: 20px;">🎯</span>
        <span class="btn-subtext" style="color: #fde68a;">發射</span>
      </button>
      <button id="btnRight" class="btn-ctrl">
        <span style="font-size: 22px;">→</span>
        <span class="btn-subtext" style="color: #a8a29e;">靠右</span>
      </button>
    </div>

  </main>

  <!-- 3. 底部按鈕：Pause / Restart / 炸彈[cite: 4, 5] -->
  <footer>
    <button id="btnPause" class="btn-ctrl">
      <span style="font-size: 18px;">⏸️</span>
      <span class="btn-subtext" style="color: #a8a29e;">Pause</span>
    </button>

    <button id="btnRestart" class="btn-ctrl">
      <span style="font-size: 18px;">🔄</span>
      <span class="btn-subtext" style="color: #fbbf24;">Restart</span>
    </button>

    <button id="btnBomb" class="btn-ctrl btn-ctrl-bomb">
      <span style="font-size: 18px;">💣</span>
      <span id="btnBombText" class="btn-subtext" style="color: #fca5a5;">炸彈 (1)</span>
    </button>
  </footer>

  <script>
    var canvas = document.getElementById('fruitCanvas');
    var ctx = canvas.getContext('2d');

    var scoreEl = document.getElementById('score');
    var bombCountHUD = document.getElementById('bombCountHUD');
    var btnBombText = document.getElementById('btnBombText');
    var nextFruitEmoji = document.getElementById('nextFruitEmoji');

    var overlay = document.getElementById('overlay');
    var overlayTitle = document.getElementById('overlayTitle');
    var finalScore = document.getElementById('finalScore');
    var startBtn = document.getElementById('startBtn');

    // 7種精簡水果層級定義
    var FRUITS = [
      { level: 0, emoji: '🍒', radius: 18, score: 2 },
      { level: 1, emoji: '🍓', radius: 25, score: 6 },
      { level: 2, emoji: '🍇', radius: 32, score: 14 },
      { level: 3, emoji: '🍊', radius: 42, score: 30 },
      { level: 4, emoji: '🍎', radius: 52, score: 62 },
      { level: 5, emoji: '🍑', radius: 64, score: 126 },
      { level: 6, emoji: '🍉', radius: 78, score: 254 }
    ];

    var fruitsOnBoard = [];
    var score = 0;
    var bombInventory = 1;
    var gameOver = false, isPaused = false, gameStarted = false;

    var currentFruitX = 0;
    var currentFruitType = 0;
    var nextFruitType = 0;
    var canDrop = true;

    function resizeCanvas() {
      var container = document.getElementById('canvasContainer');
      if (!container) return;
      canvas.width = container.clientWidth - 8;
      canvas.height = container.clientHeight - 8;
      if (currentFruitX === 0) currentFruitX = canvas.width / 2;
    }
    window.addEventListener('resize', resizeCanvas);

    // Web Audio 音效引擎
    var audioCtx = null;
    function initAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}
    }

    function playPopSound(pitch) {
      if (!audioCtx) return;
      try {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(250 + pitch * 80, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch(e){}
    }

    // 水果物件類別
    function FruitItem(x, y, level) {
      this.x = x;
      this.y = y;
      this.vx = (Math.random() - 0.5) * 0.2; // 微小微震，防止死卡
      this.vy = 0;
      this.level = level;
      this.radius = FRUITS[level].radius;
      this.emoji = FRUITS[level].emoji;
      this.isMerged = false;
    }

    function spawnNextFruit() {
      currentFruitType = nextFruitType;
      nextFruitType = Math.floor(Math.random() * 3);
      nextFruitEmoji.innerText = FRUITS[nextFruitType].emoji;
      canDrop = true;
    }

    function moveCurrentFruit(dir) {
      if (!gameStarted || isPaused || gameOver || !canDrop) return;
      var step = 15;
      var r = FRUITS[currentFruitType].radius;
      currentFruitX += dir * step;
      if (currentFruitX < r) currentFruitX = r;
      if (currentFruitX > canvas.width - r) currentFruitX = canvas.width - r;
    }

    function dropFruit() {
      if (!gameStarted || isPaused || gameOver || !canDrop) return;
      canDrop = false;
      var newFruit = new FruitItem(currentFruitX, 40, currentFruitType);
      fruitsOnBoard.push(newFruit);
      playPopSound(1);

      setTimeout(function() {
        if (!gameOver) spawnNextFruit();
      }, 400);
    }

    function activateBomb() {
      if (bombInventory <= 0 || !gameStarted || isPaused || gameOver) return;
      bombInventory--;
      playPopSound(8);

      // 炸彈消除底部最密的 3 個水果
      fruitsOnBoard.sort(function(a, b){ return b.y - a.y; });
      fruitsOnBoard.splice(0, Math.min(3, fruitsOnBoard.length));

      updateUI();
    }

    // 🍒 手寫超流暢 2D 物理碰撞與滾動堆疊演算法
    function updatePhysics() {
      var gravity = 0.45;
      var bounce = 0.22;
      var friction = 0.96;

      // 1. 重力與邊界限制
      for (var i = 0; i < fruitsOnBoard.length; i++) {
        var f = fruitsOnBoard[i];
        f.vy += gravity;
        f.x += f.vx;
        f.y += f.vy;
        f.vx *= friction;

        // 左右牆邊界反彈
        if (f.x - f.radius < 0) { f.x = f.radius; f.vx *= -bounce; }
        if (f.x + f.radius > canvas.width) { f.x = canvas.width - f.radius; f.vx *= -bounce; }
        // 底部反彈
        if (f.y + f.radius > canvas.height) { 
          f.y = canvas.height - f.radius; 
          f.vy *= -bounce; 
          f.vx *= 0.8;
        }
      }

      // 2. 水果兩兩圓形碰撞、彈開與滾動
      for (var i = 0; i < fruitsOnBoard.length; i++) {
        for (var j = i + 1; j < fruitsOnBoard.length; j++) {
          var f1 = fruitsOnBoard[i];
          var f2 = fruitsOnBoard[j];

          if (f1.isMerged || f2.isMerged) continue;

          var dx = f2.x - f1.x;
          var dy = f2.y - f1.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          var minDist = f1.radius + f2.radius;

          if (dist < minDist) {
            var overlap = minDist - dist;
            var nx = dx / (dist || 1);
            var ny = dy / (dist || 1);

            // 位置分離推開（防止重疊卡死）
            f1.x -= nx * overlap * 0.5;
            f1.y -= ny * overlap * 0.5;
            f2.x += nx * overlap * 0.5;
            f2.y += ny * overlap * 0.5;

            // 自然滾動擠壓速度分量
            f1.vx -= nx * 0.1;
            f1.vy -= ny * 0.1;
            f2.vx += nx * 0.1;
            f2.vy += ny * 0.1;

            // 🍓 相同水果碰撞 ➔ 觸發合併升級！
            if (f1.level === f2.level && f1.level < FRUITS.length - 1) {
              f1.isMerged = true;
              f2.isMerged = true;

              var newLevel = f1.level + 1;
              var newX = (f1.x + f2.x) / 2;
              var newY = (f1.y + f2.y) / 2;

              score += FRUITS[newLevel].score;
              playPopSound(newLevel);

              if (newLevel >= 4) bombInventory++;

              (function(nx, ny, nl) {
                setTimeout(function() {
                  fruitsOnBoard = fruitsOnBoard.filter(function(item){ return !item.isMerged; });
                  fruitsOnBoard.push(new FruitItem(nx, ny, nl));
                  updateUI();
                }, 20);
              })(newX, newY, newLevel);
            }
          }
        }
      }

      // 3. 溢出頂部警告判定 (Game Over)
      for (var k = 0; k < fruitsOnBoard.length; k++) {
        var fk = fruitsOnBoard[k];
        if (fk.y - fk.radius < 65 && Math.abs(fk.vy) < 0.1 && !canDrop) {
          gameOver = true;
          showOverlay('遊戲結束');
          break;
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 頂部警戒線
      ctx.strokeStyle = 'rgba(245, 158, 11, 0.4)';
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(0, 65);
      ctx.lineTo(canvas.width, 65);
      ctx.stroke();
      ctx.setLineDash([]);

      // 預備發射的水果
      if (canDrop && gameStarted && !isPaused && !gameOver) {
        var currentRadius = FRUITS[currentFruitType].radius;
        ctx.font = (currentRadius * 1.35) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(FRUITS[currentFruitType].emoji, currentFruitX, 35);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.beginPath();
        ctx.moveTo(currentFruitX, 35);
        ctx.lineTo(currentFruitX, canvas.height);
        ctx.stroke();
      }

      // 繪製容器內的水果
      for (var i = 0; i < fruitsOnBoard.length; i++) {
        var f = fruitsOnBoard[i];
        ctx.font = (f.radius * 1.35) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(f.emoji, f.x, f.y);
      }
    }

    function updateUI() {
      scoreEl.innerText = score;
      bombCountHUD.innerText = bombInventory;
      btnBombText.innerText = '炸彈 (' + bombInventory + ')';
    }

    function gameLoop() {
      if (gameStarted && !isPaused && !gameOver) {
        updatePhysics();
        draw();
      }
      requestAnimationFrame(gameLoop);
    }

    function handleStartGame() {
      initAudio();
      fruitsOnBoard = [];
      score = 0;
      bombInventory = 1;
      gameOver = false;
      isPaused = false;
      gameStarted = true;
      overlay.classList.add('hidden');
      resizeCanvas();
      nextFruitType = Math.floor(Math.random() * 3);
      spawnNextFruit();
      updateUI();
    }

    function togglePause() {
      if (!gameStarted || gameOver) return;
      isPaused = !isPaused;
      if (isPaused) {
        showOverlay('遊戲暫停');
      } else {
        overlay.classList.add('hidden');
      }
    }

    function showOverlay(title) {
      overlayTitle.innerText = title;
      finalScore.innerText = '最終得分: ' + score;
      if (title !== '水果大合併') finalScore.classList.remove('hidden');
      startBtn.innerText = title === '遊戲暫停' ? '繼續遊戲' : '開始遊戲';
      overlay.classList.remove('hidden');
    }

    // 行動裝置觸控事件綁定
    function bindButton(elementId, onClickAction, isContinuous) {
      var btn = document.getElementById(elementId);
      if (!btn) return;
      var timer = null;
      var repeatTimer = null;

      function start(e) {
        if (e && e.cancelable) e.preventDefault();
        initAudio();
        btn.classList.add('active');
        onClickAction();

        if (isContinuous) {
          timer = setTimeout(function() {
            repeatTimer = setInterval(onClickAction, 60);
          }, 160);
        }
      }

      function end(e) {
        if (e && e.cancelable) e.preventDefault();
        btn.classList.remove('active');
        clearTimeout(timer);
        clearInterval(repeatTimer);
      }

      btn.addEventListener('touchstart', start, { passive: false });
      btn.addEventListener('touchend', end);
      btn.addEventListener('touchcancel', end);

      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
      btn.addEventListener('mouseleave', end);
    }

    // 綁定草圖方向與按鈕[cite: 4, 5]
    bindButton('btnLeft', function(){ moveCurrentFruit(-1); }, true);
    bindButton('btnRight', function(){ moveCurrentFruit(1); }, true);
    bindButton('btnDown', function(){ dropFruit(); }, false);
    bindButton('btnDropRight', function(){ dropFruit(); }, false);

    bindButton('btnPause', function(){ togglePause(); }, false);
    bindButton('btnRestart', function(){ handleStartGame(); }, false);
    bindButton('btnBomb', function(){ activateBomb(); }, false);

    startBtn.addEventListener('click', function(e) {
      e.preventDefault();
      if (isPaused) togglePause();
      else handleStartGame();
    });
    startBtn.addEventListener('touchend', function(e) {
      e.preventDefault();
      if (isPaused) togglePause();
      else handleStartGame();
    });

    resizeCanvas();
    showOverlay('水果大合併');
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
